[package]
name = "pdfstamp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Draws the library's per-reader watermark onto a PDF"

[dependencies]
# No default features: the service only loads, edits and saves. Rayon and
# chrono are not needed, and a smaller dependency tree is a smaller binary
# and a faster cold build on the deploy machine.
lopdf = { version = "0.47.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
