<!-- README variant: same artwork as icon.svg, without the grain filter, which
     aliases into visible stipple when the icon is scaled or shown on a 2x display.
     Animation: bolt flash, glint sweep, wing flex. 7 s loop, static under
     prefers-reduced-motion. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="icon-title">
<title id="icon-title">NbkristQik</title>
<style>
  .flash, .glint { opacity: 0; }
  .flash, .glint, .wings { animation-duration: 7s; animation-iteration-count: infinite; animation-fill-mode: both; }
  .flash { animation-name: zap; animation-timing-function: linear; }
  .glint { animation-name: sweep; animation-timing-function: linear; transform-box: view-box; transform-origin: 0 0; }
  .wings { animation-name: breathe; animation-timing-function: ease-in-out; transform-box: view-box; transform-origin: 256px 256px; }
  @keyframes zap {
    0%, 5% { opacity: 0; }
    7% { opacity: 0.72; }
    10% { opacity: 0.1; }
    13% { opacity: 0.52; }
    19%, 100% { opacity: 0; }
  }
  @keyframes sweep {
    0%, 9% { transform: translateX(-360px); opacity: 0; }
    14% { opacity: 0.55; }
    27% { opacity: 0.55; }
    36% { transform: translateX(660px); opacity: 0; }
    100% { transform: translateX(660px); opacity: 0; }
  }
  @keyframes breathe {
    0%, 6% { transform: scale(1); }
    11% { transform: scale(1.018); }
    19%, 100% { transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .flash, .glint { display: none; }
    .wings { animation: none; }
  }
</style>
<rect width="512" height="512" fill="url(#bg)"/>
<g filter="url(#shadow-strong)"><use href="#bolt-shape" fill="url(#bolt)" stroke="#D3B2EE" stroke-width="3"/></g>
<g class="wings">
<g filter="url(#shadow)"><use href="#wing1-shape" fill="url(#wing1)" stroke="#CDB2E2" stroke-width="3"/></g>
<g filter="url(#shadow)"><use href="#wing2-shape" fill="url(#wing2)" stroke="#CDB2E2" stroke-width="3"/></g>
<use href="#wing3-shape" fill="url(#wing3)" stroke="#CDB2E2" stroke-width="3"/>
<use href="#left1-shape" fill="url(#left1)" stroke="#D3B2EE" stroke-width="4"/>
<use href="#left2-shape" fill="url(#left2)" stroke="#D3B2EE" stroke-width="4"/>
<use href="#left3-shape" fill="url(#left3)" stroke="#D3B2EE" stroke-width="4"/>
</g>
<use class="flash" href="#bolt-shape" fill="#F1E3FF" opacity="0"/>
<g clip-path="url(#mark-clip)">
<g class="glint" opacity="0">
<g transform="rotate(-22 256 256)">
<rect x="0" y="-420" width="96" height="1352" fill="url(#glint)"/>
</g>
</g>
</g>
