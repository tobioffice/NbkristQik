<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" role="img" aria-labelledby="chart-title chart-desc" style="display:block;width:100%;height:auto;max-width:960px">
  <title id="chart-title">NbkristQik usage</title>
  <desc id="chart-desc">Line chart of registered users, daily active, weekly active and monthly active across 30 daily snapshots from 19 Oct 2026 to 17 Nov 2026. Daily snapshots at 23:30 IST; aggregates only.</desc>
  <style>
    text {
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .axis {
      fill: #8794a1;
      font-size: 11.5px;
    }
    .legend {
      fill: #ffffff;
      font-size: 12px;
      font-weight: 500;
    }
    .series {
      fill: none;
      stroke-width: 2;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .series-point {
      stroke: #212a33;
      stroke-width: 1.5;
    }
  </style>
  <rect width="960" height="420" fill="#1a2026" />
  <text x="44" y="50" fill="#ffffff" font-size="27" font-weight="700">NbkristQik usage</text>
  <text x="44" y="74" fill="#8794a1" font-size="13">Daily snapshots · aggregates only</text>
  <g>
      <g data-series="registered_users">
        <line x1="44" y1="101" x2="66" y2="101" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <text x="74" y="105" class="legend">registered users</text>
      </g>
      <g data-series="dau">
        <line x1="250" y1="101" x2="272" y2="101" stroke="#4cb2ff" stroke-width="2.5" stroke-linecap="round" />
        <text x="280" y="105" class="legend">daily active</text>
      </g>
      <g data-series="wau">
        <line x1="430" y1="101" x2="452" y2="101" stroke="#7ed176" stroke-width="2.5" stroke-linecap="round" />
        <text x="460" y="105" class="legend">weekly active</text>
      </g>
      <g data-series="mau">
        <line x1="610" y1="101" x2="632" y2="101" stroke="#8794a1" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 3" />
        <text x="640" y="105" class="legend">monthly active</text>
      </g>
  </g>
  <rect x="24" y="112" width="912" height="284" rx="8" fill="#212a33" />
  <g>
