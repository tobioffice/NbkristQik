<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2026" />
  <title>NbkristQik status</title>
  <style>
    :root {
      --ground: #1a2026;
      --footer: #111417;
      --surface: #212a33;
      --surface-hover: #293440;
      --surface-active: #2d3a47;
      --text: #ffffff;
      --secondary: #8794a1;
      --tertiary: #8494a3;
      --accent: #4cb2ff;
      --action: #248bda;
      --action-hover: #207cc2;
      --danger: #f88277;
      --warning: #ff9953;
      --good: #7ed176;
      --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; background: var(--ground); }
    body {
      min-height: 100dvh; display: flex; flex-direction: column;
      background: var(--ground); color: var(--text);
      font-family: var(--font); font-size: 15px; line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(36, 139, 218, 0.35); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .column {
      width: 100%; max-width: 720px; margin: 0 auto;
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    /* one band at the head */
    .band {
      background: var(--surface);
      padding: calc(8px + env(safe-area-inset-top)) 0 8px;
    }
    .band__inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .band h1 { font-size: 17px; line-height: 24px; font-weight: 600; }
    .band__sub { font-size: 12px; line-height: 16px; color: var(--secondary); }
    .stamp {
      display: inline-flex; align-items: baseline; gap: 4px; flex-shrink: 0;
      background: var(--surface-active); border-radius: 20px; padding: 5px 10px;
      white-space: nowrap;
    }
    .stamp b {
      font-size: 13px; line-height: 16px; font-weight: 600;
      font-variant-numeric: tabular-nums; color: var(--text);
    }
    .stamp span { font-size: 11px; line-height: 16px; font-weight: 400; color: var(--secondary); }

    main { flex: 1; padding: 12px 0 48px; }

    /* state banner keeps the grouped surface shape */
    .banner {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--surface); border-radius: var(--radius);
      padding: 12px 14px; color: var(--good);
    }
    .banner.bad { color: var(--danger); }
    .banner.unknown { color: var(--warning); }
    .banner__icon { flex-shrink: 0; display: block; line-height: 0; margin-top: 1px; }
    .banner h2 { font-size: 15px; line-height: 20px; font-weight: 600; color: var(--text); }
    .banner p { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--secondary); }

    /* grouped component rows, 1px ground gaps */
    .components {
      display: flex; flex-direction: column; gap: 1px; margin-top: 12px;
      background: var(--footer); border-radius: var(--radius);
    }
    .comp { background: var(--surface); padding: 12px 14px 10px; }
    .comp:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .comp:last-child { border-radius: 0 0 var(--radius) var(--radius); }
    .comp:only-child { border-radius: var(--radius); }
    .comp-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 4px 12px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .comp-name {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 15px; line-height: 20px; font-weight: 600;
    }
    .comp-name svg { flex-shrink: 0; }
    .comp-state { font-size: 12px; line-height: 16px; font-weight: 500; }
    .comp-uptime { font-size: 12px; line-height: 16px; color: var(--secondary); font-variant-numeric: tabular-nums; }
    .comp-uptime b { color: var(--text); font-weight: 600; }

    /* 90-day bars */
    .bars { display: flex; gap: 1px; height: 26px; }
    .bars:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .bar { flex: 1; min-width: 1px; background: var(--surface-active); position: relative; }
    .bar.up { background: var(--good); }
    .bar.degraded { background: var(--warning); }
    .bar.down { background: var(--danger); }
    .bar.selected { outline: 1.5px solid var(--accent); outline-offset: 1px; z-index: 2; }
    .bar:hover::after {
      content: attr(data-tip); position: absolute; bottom: 32px; left: 50%;
      transform: translateX(-50%); background: var(--surface-active); color: var(--text);
      border-radius: 6px; padding: 5px 9px; font-size: 11px; line-height: 16px;
      font-variant-numeric: tabular-nums; white-space: nowrap; z-index: 10;
      pointer-events: none;
    }
    .bar:first-child:hover::after { left: 0; transform: none; }
    .bar:last-child:hover::after { left: auto; right: 0; transform: none; }
    .day-detail {
      margin-top: 7px; min-height: 18px; font-size: 12px; line-height: 16px;
      color: var(--secondary); font-variant-numeric: tabular-nums;
    }

    /* loading and error */
    .loading {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 56px 16px; color: var(--secondary); font-size: 13px;
      line-height: 18px; text-align: center;
    }
    .loading.is-error {
      display: block; padding: 14px; background: var(--surface);
      border-radius: var(--radius); color: var(--danger); text-align: left;
    }
    .spinner {
      width: 22px; height: 22px; border: 2px solid var(--surface-active);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    .footer {
      background: var(--footer);
      padding: 16px 0 calc(20px + env(safe-area-inset-bottom));
    }
    .footer p { text-align: center; font-size: 12px; line-height: 16px; color: var(--tertiary); }
    .footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header class="band">
    <div class="band__inner column">
      <div>
        <h1>NbkristQik</h1>
        <p class="band__sub">System status</p>
      </div>
      <div class="stamp"><b id="stamp-val">&mdash;</b><span>systems up</span></div>
    </div>
  </header>

  <main class="column">
    <div class="banner" id="banner" style="display:none">
      <span class="banner__icon" id="banner-icon" aria-hidden="true"></span>
      <div>
        <h2 id="banner-title">Checking status...</h2>
        <p id="banner-sub">We're not aware of any issues affecting our systems.</p>
      </div>
    </div>

    <div id="components-wrap" style="display:none">
      <div class="components" id="components"></div>
    </div>
    <div class="loading" id="loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      Loading status...
    </div>
  </main>

  <footer class="footer">
    <div class="column">
      <p>Updated live &middot; Last 90 days &middot; checker.tobioffice.online &middot; <a href="/stats">Usage stats</a></p>
    </div>
  </footer>

  <script>
    const IST = "Asia/Kolkata";
    const fmtDay = (d) => new Date(d + "T00:00:00+05:30").toLocaleDateString("en-GB", { timeZone: IST, day: "numeric", month: "short" });
    const fmtTime = (iso) => new Date(String(iso).replace(" ", "T") + "Z").toLocaleTimeString("en-US", { timeZone: IST, hour: "numeric", minute: "2-digit", hour12: true });
    const istDayFmt = new Intl.DateTimeFormat("en-CA", { timeZone: IST, year: "numeric", month: "2-digit", day: "2-digit" });
    // bar color: up if >=99% of pings that day were up, degraded if some failed, down if all failed
    const dayClass = (b) => {
      if (!b || b.pings === 0) return "";
      const r = b.ups / b.pings;
      if (r >= 0.99) return "up";
      if (r > 0) return "degraded";
      return "down";
    };
    const dayWord = (cls) =>
      cls === "up" ? "operational" : cls === "degraded" ? "degraded" : cls === "down" ? "down" : "no data";

    // Technical component ids do not always name what the reader experiences:
    // "lookup" is the synthetic answer check, so it reads as "Answers".
    const COMPONENT_LABELS = { lookup: "Answers" };

    const ICONS = {
      ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.4 2.4 2.4 4.6-5"/></svg>',
      bad: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9.2 9.2 5.6 5.6"/><path d="m14.8 9.2-5.6 5.6"/></svg>',
      unknown: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4.5"/><path d="M12 16v.01"/></svg>'
    };

    fetch("/api/status")
      .then((r) => r.json())
      .then((data) => {
        const comps = data.components || [];
        const allStale = comps.length > 0 && comps.every((c) => c.stale);
        const anyStale = comps.some((c) => c.stale);
        const allUp = comps.length > 0 && comps.every((c) => c.current === "up");
        // A stale component has current: "down" by construction, but that is
        // "not checked", not an outage. Only a fresh down makes the banner red.
        const anyFreshDown = comps.some((c) => !c.stale && c.current === "down");
        const upCount = comps.filter((c) => c.current === "up").length;
        document.getElementById("stamp-val").textContent = upCount + "/" + comps.length;

        const banner = document.getElementById("banner");
        banner.style.display = "flex";
        const icon = document.getElementById("banner-icon");
        const title = document.getElementById("banner-title");
        const sub = document.getElementById("banner-sub");
        banner.className = "banner" + (anyFreshDown ? " bad" : allUp ? "" : " unknown");
        icon.innerHTML = anyFreshDown ? ICONS.bad : allUp ? ICONS.ok : ICONS.unknown;
        if (allStale) {
          title.textContent = "Status unknown";
          sub.textContent = "The status monitor has not reported recently.";
        } else if (anyFreshDown) {
          title.textContent = "Experiencing issues";
          sub.textContent = "Some systems are not responding. We're on it.";
        } else if (anyStale) {
          title.textContent = "Some status data is missing";
          sub.textContent = "One or more checks have not reported recently. The system is not marked down.";
        } else if (allUp) {
          title.textContent = "We're fully operational";
          sub.textContent = "We're not aware of any issues affecting our systems.";
        } else {
          title.textContent = "Status unknown";
          sub.textContent = "No recent data.";
        }

        document.getElementById("loading").style.display = "none";
        document.getElementById("components-wrap").style.display = "block";
        const wrap = document.getElementById("components");
        wrap.innerHTML = "";

        // build 90-day calendar in IST to match the IST bucket days from the API
        const days = [];
        const nowMs = Date.now();
        for (let i = 89; i >= 0; i--) {
          days.push(istDayFmt.format(new Date(nowMs - i * 86400000)));
        }

        for (const c of comps) {
          const upPct = c.uptimePct.toFixed(2);
          const byDay = Object.fromEntries(c.buckets.map((b) => [b.day, b]));
          const isUp = c.current === "up";
          const name = COMPONENT_LABELS[c.component] ||
            c.component.charAt(0).toUpperCase() + c.component.slice(1);

          const div = document.createElement("div");
          div.className = "comp";

          const stateColor = isUp ? "#7ed176" : c.stale ? "#ff9953" : "#f88277";
          const statusWord = c.stale ? "No data" : isUp ? "Operational" : "Down";

          let barsHtml = "";
          days.forEach((day, index) => {
            const b = byDay[day];
            const cls = dayClass(b) || "none";
            // aria-label carries the status in words, so the bars do not rely
            // on colour alone. data-tip keeps the mouse hover tooltip.
            const detail =
              b && b.pings > 0
                ? `, ${((b.ups / b.pings) * 100).toFixed(0)}% up (${b.pings} checks)`
                : "";
            const label = `${fmtDay(day)}: ${dayWord(cls)}${detail}`;
            barsHtml += `<div class="bar ${cls}" role="img" aria-label="${label}" data-index="${index}" data-tip="${label}"></div>`;
          });

          div.innerHTML = `
            <div class="comp-head">
              <span class="comp-name">
                <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="${stateColor}"/></svg>
                ${name}
                <span class="comp-state" style="color:${stateColor}">${statusWord}</span>
              </span>
              <span class="comp-uptime"><b>${upPct}%</b> uptime &middot; last check ${fmtTime(c.lastPing)} IST</span>
            </div>
            <div class="bars" role="group" tabindex="0" aria-label="90-day uptime for ${name}. Use the left and right arrow keys to inspect a day.">${barsHtml}</div>
            <p class="day-detail" role="status" aria-live="polite">Tap a bar or use the arrow keys for the day detail.</p>
          `;
          wrap.appendChild(div);

          const barsEl = div.querySelector(".bars");
          const detailEl = div.querySelector(".day-detail");
          const barEls = Array.from(barsEl.querySelectorAll(".bar"));
          let activeIndex = days.length - 1;

          const showDay = (index) => {
            activeIndex = Math.min(Math.max(index, 0), barEls.length - 1);
            barEls.forEach((bar, i) => bar.classList.toggle("selected", i === activeIndex));
            detailEl.textContent =
              barEls[activeIndex]?.getAttribute("aria-label") || "No day selected.";
          };

          barsEl.addEventListener("click", (event) => {
            const target = event.target.closest?.(".bar");
            if (!target || !barsEl.contains(target)) return;
            showDay(Number(target.dataset.index));
          });

          barsEl.addEventListener("focus", () => showDay(activeIndex));

          barsEl.addEventListener("keydown", (event) => {
            let next = activeIndex;
            if (event.key === "ArrowLeft" || event.key === "ArrowDown") next -= 1;
            else if (event.key === "ArrowRight" || event.key === "ArrowUp") next += 1;
            else if (event.key === "Home") next = 0;
            else if (event.key === "End") next = days.length - 1;
            else return;
            event.preventDefault();
            showDay(next);
          });
        }
      })
      .catch(() => {
        const loading = document.getElementById("loading");
        loading.classList.add("is-error");
        loading.textContent = "Status unavailable right now.";
        document.getElementById("banner-title").textContent = "Status unavailable";
        document.getElementById("banner-sub").textContent = "Couldn't reach the status API.";
      });
  </script>
</body>
</html>
