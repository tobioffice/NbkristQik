<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NbkristQik Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117; color: #e6edf3;
      min-height: 100vh; padding: 24px 16px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .banner {
      border: 1px solid #1f6f43; background: rgba(46,160,67,.12);
      border-radius: 10px; padding: 16px 18px; margin-bottom: 24px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .banner.bad { border-color: #9e2f2f; background: rgba(218,54,51,.12); }
    .banner .dot { width: 20px; height: 20px; flex-shrink: 0; margin-top: 1px; }
    .banner h2 { font-size: 16px; font-weight: 600; color: #3fb950; margin-bottom: 4px; }
    .banner.bad h2 { color: #f85149; }
    .banner p { font-size: 13px; color: #8b949e; }
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 10px; padding: 4px 0; margin-bottom: 24px; overflow: hidden;
    }
    .comp { padding: 16px 20px; border-bottom: 1px solid #21262d; }
    .comp:last-child { border-bottom: none; }
    .comp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .comp-name { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
    .comp-name .dot { width: 14px; height: 14px; flex-shrink: 0; }
    .comp-uptime { font-size: 12px; color: #8b949e; }
    .comp-uptime b { color: #c9d1d9; font-weight: 600; }
    .bars { display: flex; gap: 2px; height: 28px; }
    .bar { flex: 1; border-radius: 1px; min-width: 1px; background: #21262d; position: relative; }
    .bar.up { background: #2ea043; }
    .bar.degraded { background: #d29922; }
    .bar.down { background: #da3633; }
    .bar.none { background: #21262d; }
    .bar:hover::after {
      content: attr(data-tip); position: absolute; bottom: 34px; left: 50%;
      transform: translateX(-50%); background: #1c2128; color: #e6edf3;
      border: 1px solid #30363d; padding: 5px 9px; border-radius: 6px;
      font-size: 11px; white-space: nowrap; z-index: 10; pointer-events: none;
    }
    .footer { text-align: center; font-size: 12px; color: #6e7681; padding: 12px 0 24px; }
    .loading { text-align: center; color: #8b949e; padding: 60px 0; font-size: 14px; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #30363d; border-top-color: #2ea043;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="banner" class="banner" style="display:none">
      <svg class="dot" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="#2ea043"/><path d="M4.5 8.5l2.5 2.5 4.5-5" stroke="#0d1117" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <h2 id="banner-title">Checking status...</h2>
        <p id="banner-sub">We're not aware of any issues affecting our systems.</p>
      </div>
    </div>

    <div class="card">
      <div id="components" class="loading">
        <div class="spinner"></div>
        Loading status...
      </div>
    </div>

    <p class="footer">Updated live · Last 90 days · checker.tobioffice.dev</p>
  </div>

  <script>
    const fmtDay = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const fmtTime = (iso) => new Date(iso + "Z").toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
    // bar color: up if >=99% of pings that day were up, degraded if some failed, down if all failed
    const dayClass = (b) => {
      if (!b || b.pings === 0) return "";
      const r = b.ups / b.pings;
      if (r >= 0.99) return "up";
      if (r > 0) return "degraded";
      return "down";
    };

    fetch("/api/status")
      .then((r) => r.json())
      .then((data) => {
        const comps = data.components || [];
        const allUp = comps.every((c) => c.current === "up");
        const anyDown = comps.some((c) => c.current === "down");

        const banner = document.getElementById("banner");
        const title = document.getElementById("banner-title");
        const sub = document.getElementById("banner-sub");
        if (anyDown) {
          banner.classList.add("bad");
          title.textContent = "Experiencing issues";
          title.style.color = "#f85149";
          sub.textContent = "Some systems are not responding. We're on it.";
        } else if (allUp) {
          title.textContent = "We're fully operational";
          sub.textContent = "We're not aware of any issues affecting our systems.";
        } else {
          title.textContent = "Status unknown";
          sub.textContent = "No recent data.";
        }

        const wrap = document.getElementById("components");
        wrap.className = "";
        wrap.innerHTML = "";

        // build 90-day calendar for bar alignment
        const days = [];
        const now = new Date();
        for (let i = 89; i >= 0; i--) {
          const d = new Date(now.getTime() - i * 86400000);
          days.push(d.toISOString().slice(0, 10));
        }

        for (const c of comps) {
          const upPct = c.uptimePct.toFixed(2);
          const byDay = Object.fromEntries(c.buckets.map((b) => [b.day, b]));
          const isUp = c.current === "up";

          const div = document.createElement("div");
          div.className = "comp";

          const dotColor = isUp ? "#2ea043" : c.lastPingAgeSec < 3600 ? "#d29922" : "#da3633";
          const statusWord = isUp ? "Operational" : c.lastPingAgeSec < 3600 ? "Degraded" : "Down";

          let barsHtml = "";
          for (const day of days) {
            const b = byDay[day];
            const cls = dayClass(b) || "none";
            const tip = b
              ? `${fmtDay(day)}: ${((b.ups / b.pings) * 100).toFixed(0)}% up (${b.pings} checks)`
              : `${fmtDay(day)}: no data`;
            barsHtml += `<div class="bar ${cls}" data-tip="${tip}"></div>`;
          }

          div.innerHTML = `
            <div class="comp-head">
              <span class="comp-name">
                <svg class="dot" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="8" fill="${dotColor}"/></svg>
                ${c.component.charAt(0).toUpperCase() + c.component.slice(1)}
              </span>
              <span class="comp-uptime"><b>${upPct}%</b> uptime</span>
            </div>
            <div class="bars">${barsHtml}</div>
          `;
          wrap.appendChild(div);
        }
      })
      .catch(() => {
        document.getElementById("components").innerHTML =
          '<div class="loading">⚠️ Status unavailable right now.</div>';
        document.getElementById("banner-title").textContent = "Status unavailable";
        document.getElementById("banner-sub").textContent = "Couldn't reach the status API.";
      });
  </script>
</body>
</html>
