<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="Liberation Serif, serif">
<rect width="700" height="300" fill="#f6efdd"/>
<rect x="110" y="28" width="480" height="64" fill="#f7f5ee" stroke="#5a5140"/>
<text x="350" y="56" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e2a38">Environment</text>
<text x="350" y="77" font-size="12" text-anchor="middle" fill="#5a5140">the world the agent perceives and changes</text>
<rect x="180" y="200" width="340" height="64" fill="#f6efdd" stroke="#5a5140"/>
<text x="350" y="228" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e2a38">Agent</text>
<text x="350" y="249" font-size="12" text-anchor="middle" fill="#5a5140">senses, decides, acts</text>
<line x1="250" y1="92" x2="250" y2="200" stroke="#1e2a38" stroke-width="1.5"/>
<polygon points="250,200 246,193 254,193" fill="#1e2a38"/>
<text x="240" y="138" font-size="12" text-anchor="end" fill="#5a5140">percepts</text>
<text x="240" y="154" font-size="12" text-anchor="end" fill="#5a5140">through sensors</text>
<line x1="450" y1="200" x2="450" y2="92" stroke="#1e2a38" stroke-width="1.5"/>
<polygon points="450,92 446,99 454,99" fill="#1e2a38"/>
<text x="460" y="138" font-size="12" fill="#5a5140">actions</text>
<text x="460" y="154" font-size="12" fill="#5a5140">through actuators</text>
<text x="350" y="290" font-size="11" text-anchor="middle" fill="#777777">agent = architecture + program; percepts in, actions out</text>
</svg>
