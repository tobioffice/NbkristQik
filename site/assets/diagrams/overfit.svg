<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480"><style>text{font-family:'Liberation Serif',Georgia,serif;fill:#1e2a38}.small{font-size:16px;fill:#5a5140}.axis{stroke:#1e2a38;stroke-width:2}</style><rect width="900" height="480" fill="#f6efdd"/><text x="450" y="32" text-anchor="middle" class="small">error is measured on data not used to fit the choice</text><path d="M100 395H820M100 395V70" class="axis"/><text x="460" y="455" text-anchor="middle" class="small">model complexity</text><text x="34" y="240" transform="rotate(-90 34 240)" text-anchor="middle" class="small">error</text><path d="M130 150 C260 190 350 250 470 305 C600 355 710 375 800 380" fill="none" stroke="#5a5140" stroke-width="4"/><path d="M130 270 C240 245 340 220 470 245 C590 270 690 325 800 355" fill="none" stroke="#999" stroke-width="4"/><circle cx="470" cy="245" r="8" fill="#1e2a38"/><path d="M470 245v131" stroke="#777" stroke-dasharray="4 4"/><text x="470" y="414" text-anchor="middle" class="small">minimum validation error</text><text x="735" y="390" class="small">training error</text><text x="665" y="108" class="small">validation error</text><rect x="120" y="85" width="210" height="62" fill="#f7f5ee" stroke="#777"/><text x="225" y="111" text-anchor="middle" class="small">underfit: both errors high</text><rect x="610" y="180" width="220" height="62" fill="#f7f5ee" stroke="#777"/><text x="720" y="206" text-anchor="middle" class="small">overfit: gap grows</text><text x="450" y="52" text-anchor="middle" class="small">lower is better</text></svg>
